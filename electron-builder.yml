appId: com.alexisboudinot.blackjack-odds
productName: Blackjack Odds
copyright: Outil d'analyse personnel

directories:
  output: release
  buildResources: build

# Le rendu est entièrement bundlé dans dist/ : aucune dépendance npm n'est
# nécessaire à l'exécution, on garde donc le paquet minimal.
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!node_modules/**/*'

asar: true

mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Build non signé : pas de certificat Apple Developer.
  identity: null

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}

publish: null
