name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex: v1.0.0)"
        required: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            args: --mac
          - os: windows-latest
            platform: Windows
            args: --win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le moteur est la partie qui doit être juste : aucune release ne part
      # si la stratégie de base n'est pas reproduite à l'identique.
      - name: Tests du moteur
        run: npm test

      - name: Build de l'app web
        run: npm run build

      - name: Empaquetage Electron
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Builds non signés : pas de certificat Apple Developer ni Authenticode.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # Les fichiers `latest*.yml` sont le flux que lit le client de mise
          # à jour : sans eux, l'app installée ne verra jamais la version.
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/latest*.yml
          if-no-files-found: error

  release:
    name: Publier la release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Créer ou mettre à jour la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la artifacts
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Blackjack Odds $TAG" \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" artifacts/* --clobber
